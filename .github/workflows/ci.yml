
name: My First CI CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  test:
    name: Build and Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Download Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t ci-docker-lab:test .

      - name: Run Unit Tests
        run: |
          docker run --rm ci-docker-lab:test \
            python -m unittest discover -v

      - name: Test Web Server
        run: |
          docker run -d --name test-web \
            -p 8000:8000 ci-docker-lab:test

          for i in {1..10}; do
            if curl -fsS http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done

          docker logs test-web
          exit 1

  publish:
    name: Publish Docker Image to GHCR
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Source Code
        uses: actions/checkout@v4

      - name: Prepare Image Name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" \
            >> "$GITHUB_OUTPUT"

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Publish Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
